<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment - 02</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form-container">
      <h1>Application Form</h1>

      <!-- A. General Information -->
      <fieldset>
        <legend>A. General Information</legend>

        <div class="form-grid">
          <div class="form-group">
            <label>Proposed Insured's Full Name <span>*</span></label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Birth Date <span>*</span></label>
            <input type="date" />
          </div>

          <div class="form-group full">
            <label>Gender:</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" /> Male</label>
              <label><input type="radio" name="gender" /> Female</label>
            </div>
          </div>

          <div class="form-group full">
            <label>Address <span>*</span></label>
            <textarea></textarea>
          </div>

          <div class="form-group">
            <label>Phone Number <span>*</span></label>
            <input type="tel" placeholder="0300-1234567" />
          </div>

          <div class="form-group">
            <label>Email Address <span>*</span></label>
            <input type="email" placeholder="example@gmail.com" />
          </div>

          <div class="form-group">
            <label>ID / CNIC Number <span>*</span></label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Social Security / Reference Number</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Marital Status <span>*</span></label>
            <select>
              <option>Select status</option>
              <option>Single</option>
              <option>Married</option>
            </select>
          </div>

          <div class="form-group">
            <label>Occupation <span>*</span></label>
            <input type="text" />
          </div>

          <div class="form-group full">
            <label>Are you resident?</label>
            <div class="radio-group">
              <label><input type="radio" name="resident" /> Yes</label>
              <label><input type="radio" name="resident" /> No</label>
            </div>
          </div>
        </div>
      </fieldset>

      <!-- B. Type of Health Coverage -->
      <fieldset>
        <legend>B. Type of Health Coverage</legend>

        <div class="coverage-box">
          <label>Employee Coverage</label>
          <div class="radio-group">
            <label><input type="radio" name="employee" /> Yes</label>
            <label><input type="radio" name="employee" /> No</label>
          </div>

          <label>Employee Plan Choice</label>
          <select>
            <option>Select plan</option>
            <option>Basic Plan</option>
            <option>Premium Plan</option>
          </select>
        </div>

        <div class="coverage-box">
          <label>Spouse Coverage</label>
          <div class="radio-group">
            <label><input type="radio" name="spouse" /> Yes</label>
            <label><input type="radio" name="spouse" /> No</label>
          </div>

          <label>Spouse Plan Choice</label>
          <select>
            <option>Select plan</option>
            <option>Basic Plan</option>
            <option>Premium Plan</option>
          </select>
        </div>

        <div class="coverage-box">
          <label>Children Coverage</label>
          <div class="radio-group">
            <label><input type="radio" name="children" /> Yes</label>
            <label><input type="radio" name="children" /> No</label>
          </div>

          <label>Children Plan Choice</label>
          <select>
            <option>Select plan</option>
            <option>Basic Plan</option>
            <option>Premium Plan</option>
          </select>
        </div>
      </fieldset>

      <!-- C. Spouse / Children Information -->
      <fieldset>
        <legend>C. Spouse / Children Information</legend>

        <div class="form-grid">
          <div class="form-group">
            <label>Dependent Name</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>ID / SSN</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Relationship</label>
            <select>
              <option>Select relationship</option>
              <option>Spouse</option>
              <option>Child</option>
            </select>
          </div>

          <div class="form-group">
            <label>Birth Date</label>
            <input type="date" />
          </div>

          <div class="form-group">
            <label>Age</label>
            <input type="number" />
          </div>

          <div class="form-group">
            <label>Gender</label>
            <select>
              <option>Select gender</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- D. Plan Information -->
      <fieldset>
        <legend>D. Plan Information</legend>

        <div class="form-grid">
          <div class="form-group">
            <label>Units</label>
            <input type="number" />
          </div>

          <div class="form-group">
            <label>Annual Premium</label>
            <input type="text" />
          </div>

          <div class="form-group full">
            <label>Payment Mode</label>
            <select>
              <option>Select payment mode</option>
              <option>Monthly</option>
              <option>Quarterly</option>
              <option>Yearly</option>
            </select>
          </div>

          <div class="form-group">
            <label>Cash With Application</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Planned Monthly Premium</label>
            <input type="text" />
          </div>
        </div>
      </fieldset>

      <!-- E. Required Documents -->
      <fieldset>
        <legend>E. Required Documents</legend>

        <p>
          Please attach any supporting documents before submitting the
          application.
        </p>

        <label>Attach Documents</label>
        <input type="file" />

        <small>Accepted formats: PDF, JPG, PNG</small>
      </fieldset>

      <!-- F. Declaration -->
      <fieldset>
        <legend>F. Declaration</legend>

        <label class="checkbox">
          <input type="checkbox" />
          I confirm that the information provided in this application is
          complete and accurate.
        </label>

        <div class="form-grid">
          <div class="form-group">
            <label>Applicant Full Name / Signature</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Application Date</label>
            <input type="date" />
          </div>
        </div>
      </fieldset>

      <div class="buttons">
        <button type="reset" class="clear-btn">Clear Form</button>
        <button type="submit" class="submit-btn">Submit Application</button>
      </div>
    </div>
  </body>
</html>
